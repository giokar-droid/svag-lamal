<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Qualche domanda sulla tua cassa malati: con i premi ufficiali UFSP 2027 la pagina ti dice se per il 2027 ti conviene cambiare, e perché.">
<title>La tua cassa malati 2027</title>
<script>
  // tema scelto a mano (solo una comodità di questo dispositivo)
  try { var t = localStorage.getItem("svag-lamal-tema"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}

<style>
:root {
  --bg: #FBF7F1; --card: #FFFFFF; --ink: #23302D; --muted: #586560; --line: #E8E0D3;
  --accent: #0B7466; --accent-ink: #FFFFFF; --accent-soft: #E0F1EC;
  --warm: #B34A22; --warm-soft: #FCEADF; --ok: #2C7349; --ok-soft: #E2F2E7;
  --gold: #8A6420; --gold-soft: #F7EDD6; --off: #F3EDE3;
  --serie-premi: #00897B; --serie-spese: #C8552A;
  --ombra: 0 1px 2px rgba(60, 40, 20, .05), 0 8px 22px rgba(60, 40, 20, .07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141A19; --card: #1D2523; --ink: #ECEFEC; --muted: #A7B2AE; --line: #303A37;
    --accent: #4FBFAE; --accent-ink: #0C1412; --accent-soft: #1B3430;
    --warm: #F09A72; --warm-soft: #3A251E; --ok: #76CF99; --ok-soft: #1A3123;
    --gold: #E0BC72; --gold-soft: #362E1E; --off: #232C2A;
    --serie-premi: #17A08E; --serie-spese: #DD7038;
    --ombra: none;
  }
}
:root[data-theme="dark"] {
  --bg: #141A19; --card: #1D2523; --ink: #ECEFEC; --muted: #A7B2AE; --line: #303A37;
  --accent: #4FBFAE; --accent-ink: #0C1412; --accent-soft: #1B3430;
  --warm: #F09A72; --warm-soft: #3A251E; --ok: #76CF99; --ok-soft: #1A3123;
  --gold: #E0BC72; --gold-soft: #362E1E; --off: #232C2A;
  --serie-premi: #17A08E; --serie-spese: #DD7038;
  --ombra: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink);
  background: radial-gradient(900px 340px at 50% -140px, var(--warm-soft), transparent 75%) no-repeat, var(--bg);
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  overflow-x: hidden;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
header.top { padding-top: 14px; padding-bottom: 6px; }
.testa { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.marca { font-size: 15px; color: var(--muted); line-height: 1.3; }
.marca b { color: var(--ink); font-weight: 650; }
button.tema {
  flex: 0 0 auto; width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0;
}
.avanz { height: 6px; background: var(--line); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.avanz > i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--warm)); transition: width .3s; }
main:focus { outline: none; }
#app { overflow-wrap: break-word; }
.passo-anim { animation: entra .28s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .passo-anim { animation: none; } .avanz > i { transition: none; } }

h1 { font-size: 28px; line-height: 1.2; margin: 6px 0 8px; letter-spacing: -.01em; }
h2.q { font-size: 24px; line-height: 1.25; margin: 2px 0 8px; letter-spacing: -.005em; }
h3 { font-size: 21px; line-height: 1.3; margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
h3 .h-ico { color: var(--accent); display: inline-grid; }
p { margin: 0 0 12px; }
.sotto { color: var(--muted); margin: 0 0 14px; }
.aiuto { color: var(--muted); font-size: 16px; margin: 0 0 18px; }
.nota { color: var(--muted); font-size: 15px; }
.q-ico, .hero-ico {
  width: 56px; height: 56px; border-radius: 18px; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; margin: 20px 0 12px;
}
.hero-ico { width: 64px; height: 64px; border-radius: 22px; background: var(--warm-soft); color: var(--warm); margin-top: 24px; }
ul.punti, ol.punti { padding-left: 22px; margin: 0 0 16px; }
ul.punti li, ol.punti li { margin-bottom: 8px; }
.tiles { display: grid; gap: 10px; margin: 18px 0; }
@media (min-width: 560px) { .tiles { grid-template-columns: 1fr 1fr 1fr; } }
.tile { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--ombra); }
.tile .t-ico { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.tile b { display: block; font-size: 16px; line-height: 1.3; }
.tile span.s { display: block; font-size: 15px; color: var(--muted); line-height: 1.3; }

.box { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; margin: 14px 0; }
.box.oro { background: var(--gold-soft); }
.box.caldo { background: var(--warm-soft); }
.box.neutro { background: var(--off); }
.box ul { margin: 8px 0 0; padding-left: 20px; }
.box li { margin-bottom: 6px; }
.box .tit { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.box p:last-child { margin-bottom: 0; }
.box.privacy li { font-size: 16px; }

/* scelte */
.opzioni { display: grid; gap: 10px; }
.griglia { grid-template-columns: 1fr 1fr; }
@media (min-width: 620px) { .griglia.tre { grid-template-columns: 1fr 1fr 1fr; } }
.griglia .largo { grid-column: 1 / -1; }
.opz {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 12px 14px 12px 16px;
  font: inherit; text-align: left; line-height: 1.3; background: var(--card); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 16px; cursor: pointer; box-shadow: var(--ombra);
  transition: border-color .15s, background-color .15s, transform .08s;
  -webkit-tap-highlight-color: transparent;
}
.opz:active { transform: scale(.985); }
.opz .oi { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--off); color: var(--accent); }
.opz .ot { flex: 1 1 auto; min-width: 0; }
.opz .ot b { display: block; font-weight: 650; }
.opz .ot small { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; font-weight: 400; }
.opz .spunta { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 999px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.opz.multi .spunta { border-radius: 8px; }
.opz[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opz[aria-pressed="true"] .oi { background: var(--card); }
.opz[aria-pressed="true"] .spunta { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opz.compatta { min-height: 56px; padding: 10px 12px 10px 14px; gap: 10px; }
.opz.compatta .spunta { width: 22px; height: 22px; }
.opz.nonso { background: transparent; border-style: dashed; box-shadow: none; min-height: 54px; }
.opz:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sotto-dom { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
.q2 { font-size: 20px; font-weight: 700; line-height: 1.3; margin: 0 0 6px; }
.dom2 { margin: 0 0 22px; }
.lbl2 { font-weight: 650; font-size: 18px; line-height: 1.35; }
.aiuto2 { color: var(--muted); font-size: 15px; margin: 2px 0 10px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  font: inherit; font-size: 16px; min-height: 48px; padding: 10px 18px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink); -webkit-tap-highlight-color: transparent;
}
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }

/* campi */
.campo-grande {
  font: inherit; font-size: 26px; font-weight: 650; letter-spacing: .04em; width: 100%; max-width: 240px;
  padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--ink);
}
.campo-grande:focus { outline: none; border-color: var(--accent); }
.riga-campo { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
.num-w { position: relative; flex: 0 1 260px; }
.num-w .cur { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 17px; pointer-events: none; }
.num-w .campo-grande { padding-left: 62px; text-align: right; max-width: none; }
.unita-t { color: var(--muted); }
.esito-campo { min-height: 1.5em; margin: 12px 0 0; font-size: 16px; display: flex; gap: 8px; align-items: flex-start; }
.esito-campo svg { flex: 0 0 auto; margin-top: 2px; }
.esito-campo.ok { color: var(--ok); }
.esito-campo.err { color: var(--warm); font-weight: 600; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--warm-soft); color: var(--warm); font-size: 15px; font-weight: 650; }
.chip-riga { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 16px; color: var(--muted); }
label.campo { display: block; font-weight: 650; margin: 18px 0 6px; }
input.testo { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
input.testo:focus { outline: none; border-color: var(--accent); }

/* risultato */
.verdetto { border-radius: 24px; padding: 20px 18px 18px; margin: 16px 0 6px; background: var(--warm-soft); }
.verdetto.bene { background: var(--ok-soft); }
.verdetto.dipende { background: var(--gold-soft); }
.verdetto .v-testa { display: flex; align-items: center; gap: 10px; color: var(--warm); font-weight: 700; font-size: 16px; }
.verdetto.bene .v-testa { color: var(--ok); }
.verdetto.dipende .v-testa { color: var(--gold); }
.verdetto .v-tit { font-size: 26px; font-weight: 750; line-height: 1.2; margin: 10px 0 4px; letter-spacing: -.01em; }
.verdetto .v-pre { font-size: 18px; font-weight: 600; margin: 6px 0 0; }
.verdetto .v-cifra { font-size: 52px; font-weight: 750; line-height: 1.05; letter-spacing: -.02em; margin: 2px 0 0; }
.verdetto .v-cifra small { font-size: 18px; font-weight: 600; letter-spacing: 0; color: var(--muted); }
.verdetto .v-sotto { font-size: 16px; margin: 8px 0 0; }
.perche { list-style: none; padding: 0; margin: 14px 0 0; }
.perche li { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 10px; }
.perche li svg { flex: 0 0 auto; margin-top: 3px; color: var(--accent); }
.sez { margin-top: 30px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; box-shadow: var(--ombra); }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 9px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 16px; }
tr:last-child td { border-bottom: 0; }
th { font-size: 15px; color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.k { color: var(--muted); width: 42%; }
tr.forte td { font-weight: 700; font-size: 18px; }
.alt { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 10px 0; }
.alt .rk { grid-row: span 3; width: 34px; height: 34px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 750; display: grid; place-items: center; }
.alt .a-nome { font-weight: 700; font-size: 18px; line-height: 1.3; }
.alt .a-prod { color: var(--muted); font-size: 16px; line-height: 1.35; }
.alt .a-cifre { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; margin-top: 8px; align-items: baseline; }
.alt .a-mese { font-weight: 650; }
.alt .a-risp { font-weight: 700; color: var(--ok); }
.alt .a-risp.piu { color: var(--muted); font-weight: 600; }
.tag { display: inline-block; font-size: 15px; padding: 1px 10px; border-radius: 999px; background: var(--off); color: var(--muted); font-weight: 600; margin-left: 4px; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; color: var(--muted); margin: 4px 0 8px; }
.legenda i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
.legenda i.p { background: var(--serie-premi); }
.legenda i.s { background: var(--serie-spese); }
#grafico { width: 100%; }
svg.graf { display: block; overflow: visible; }
svg.graf text { font-family: inherit; font-size: 15px; fill: var(--ink); }
svg.graf text.forte { font-weight: 700; }
svg.graf text.debole { fill: var(--muted); }
svg.graf .s-premi { fill: var(--serie-premi); }
svg.graf .s-spese { fill: var(--serie-spese); }
svg.graf .evid { fill: var(--ok-soft); }
svg.graf .spunta-g { stroke: var(--ok); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
svg.graf .hit { fill: transparent; cursor: pointer; }
.tip {
  position: fixed; z-index: 30; max-width: 270px; padding: 9px 12px; border-radius: 12px; pointer-events: none;
  background: var(--ink); color: var(--bg); font-size: 15px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
}
.date-tab td.n { font-weight: 700; }
.passi { counter-reset: p; list-style: none; padding: 0; margin: 14px 0 0; }
.passi li { counter-increment: p; position: relative; padding: 0 0 14px 46px; }
.passi li::before {
  content: counter(p); position: absolute; left: 0; top: -2px; width: 32px; height: 32px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font-weight: 750; display: grid; place-items: center;
}
.passi li b { display: block; }
details { margin: 12px 0; }
details summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 16px; padding: 6px 0; }
pre { white-space: pre-wrap; word-break: break-all; background: var(--off); padding: 12px; border-radius: 10px; font-size: 15px; }
.risposte td.n a { color: var(--accent); font-size: 16px; }
.azioni { display: grid; gap: 10px; margin: 18px 0; }
button.primario, button.secondario {
  font: inherit; font-weight: 650; border-radius: 14px; padding: 15px 18px; cursor: pointer; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
button.primario { background: var(--accent); color: var(--accent-ink); border: 0; font-size: 18px; }
button.secondario { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
button.link { font: inherit; font-size: 16px; background: transparent; border: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; cursor: pointer; text-align: left; }
.esito { font-weight: 600; color: var(--accent); min-height: 1.5em; }
.vuoto { text-align: center; padding: 48px 0; color: var(--muted); }

nav.barra {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 10;
  border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
}
nav.barra .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
nav.barra button { font: inherit; font-weight: 650; border-radius: 14px; padding: 12px 16px; min-width: 112px; min-height: 48px; cursor: pointer; }
#indietro { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
#avanti { background: var(--accent); border: 0; color: var(--accent-ink); }
nav.barra .invisibile { visibility: hidden; }
#passo { font-size: 15px; color: var(--muted); text-align: center; }
@media print {
  nav.barra, button.tema, .invio, .tip { display: none !important; }
  body { padding: 0; background: #fff; }
  .opz, .card, .tile { box-shadow: none; }
}
</style>
</head>
<body>
<header class="wrap top">
  <div class="testa">
    <div class="marca"><b>Giorgio Carrara</b><br>consulenza patrimoniale SVAG</div>
    <button class="tema" id="tema" type="button" aria-label="Cambia tema chiaro o scuro"></button>
  </div>
  <div class="avanz" aria-hidden="true"><i id="avanz"></i></div>
</header>
<main class="wrap" id="app" tabindex="-1"><p class="vuoto">Carico i premi 2027…</p></main>
<nav class="barra" aria-label="Navigazione">
  <div class="wrap">
    <button id="indietro" type="button">← Indietro</button>
    <span id="passo"></span>
    <button id="avanti" type="button">Avanti →</button>
  </div>
</nav>
<div class="tip" id="tip" hidden></div>

      var wP = sc(r.premi), wC = sc(r.carico), conC = wC >= 3;
      s += pathBarra(x0, x0 + wP, by, bh, !conC, "s-premi");
      if (conC) s += pathBarra(x0 + wP + 2, x0 + wP + wC, by, bh, true, "s-spese");
      s += '<rect class="hit" x="0" y="' + y + '" width="' + W + '" height="' + rowH + '"/></g>';
    });
    s += '</svg>';
    box.innerHTML = s;
    var svg = box.querySelector("svg");
    function mostraTip(e, g) {
      var r = righe[Number(g.getAttribute("data-i"))];
      var tip = $("tip");
      tip.innerHTML = "<b>Franchigia " + fmt(r.f) + "</b><br>12 premi: " + chf(r.premi) + "<br>A tuo carico: " + chf(r.carico) + "<br>Totale: <b>" + chf(r.tot) + "</b>";
      tip.hidden = false;
      var x = e.clientX + 14, y = e.clientY + 14, tw = tip.offsetWidth, th = tip.offsetHeight;
      if (x + tw > window.innerWidth - 8) x = Math.max(8, e.clientX - tw - 14);
      if (y + th > window.innerHeight - 8) y = Math.max(8, e.clientY - th - 14);
      tip.style.left = x + "px"; tip.style.top = y + "px";
    }
    svg.querySelectorAll("g.rg").forEach(function (g) {
      g.addEventListener("pointermove", function (e) { if (e.pointerType === "mouse") mostraTip(e, g); });
      g.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") nascondiTip(); });
      g.addEventListener("click", function (e) { mostraTip(e, g); });
    });
  }
  function nascondiTip() { var t = $("tip"); if (t) t.hidden = true; }
  document.addEventListener("scroll", nascondiTip, { passive: true });
  document.addEventListener("click", function (e) { if (!(e.target.closest && e.target.closest("g.rg"))) nascondiTip(); });
  var tRidim = null;
  window.addEventListener("resize", function () { clearTimeout(tRidim); tRidim = setTimeout(disegnaGrafico, 150); });

  function sezPassi(R) {
    var v = R.verdetto, best = R.best, stessa = best && best.num === R.cassa;
    if (v.tipo === "bene") {
      return '<h3><span class="h-ico">' + ico("calcheck", 22) + '</span>Cosa fare</h3><div class="box"><p>Per la cassa non devi fare niente: la polizza continua da sola nel 2027.</p>' +
        '<p>Se vuoi cambiare solo la franchigia, restando dove sei: per abbassarla scrivi alla cassa entro ' + DATE.arrivo + ', per alzarla entro ' + DATE.alzare + '.</p></div>';
    }
    var h = '<h3><span class="h-ico">' + ico("calcheck", 22) + '</span>' + (v.tipo === "cambia" ? "I passi e le date" : "Se decidi di cambiare: i passi e le date") + '</h3>';
    if (stessa && v.tipo === "cambia" && best.stesso) {
      return h + '<div class="card"><table class="date-tab"><thead><tr><th>Entro</th><th>Cosa</th></tr></thead><tbody>' +
        '<tr><td class="n">' + DATE.arrivo + '</td><td>Deve arrivare alla tua cassa la richiesta scritta di togliere l’infortunio</td></tr>' +
        '<tr><td class="n">' + DATE.inizio + '</td><td>Paghi il premio senza infortunio</td></tr></tbody></table></div>' +
        '<ol class="passi"><li><b>Resti nella tua cassa.</b> Niente disdetta: chiedi per iscritto di togliere l’infortunio, perché ti copre già il datore di lavoro. Giorgio ti prepara il testo.</li>' +
        '<li><b>Tieni pronta la conferma del datore di lavoro.</b> La cassa può chiederti di dimostrare che lavori almeno 8 ore a settimana per lui.</li>' +
        '<li><b>Se smetti di lavorare o scendi sotto le 8 ore a settimana.</b> Avvisa subito la cassa: l’infortunio va rimesso.</li></ol>';
    }
    if (stessa && v.tipo === "cambia") {
      return h + '<div class="card"><table class="date-tab"><thead><tr><th>Entro</th><th>Cosa</th></tr></thead><tbody>' +
        '<tr><td class="n">' + DATE.arrivo + '</td><td>Deve arrivare alla tua cassa la richiesta scritta di passare a ' + esc(nomeProd(best.num, best.code, true)) + '</td></tr>' +
        '<tr><td class="n">' + DATE.inizio + '</td><td>Parte il nuovo modello</td></tr></tbody></table></div>' +
        '<ol class="passi"><li><b>Resti nella tua cassa.</b> Niente disdetta: chiedi per iscritto di cambiare modello. Giorgio ti prepara il testo.</li>' +
        '<li><b>Mandala presto.</b> Per stare larga, spediscila entro ' + DATE.raccomandata + '.</li></ol>';
    }
    h += '<div class="card"><table class="date-tab"><thead><tr><th>Entro</th><th>Cosa</th></tr></thead><tbody>' +
      '<tr><td class="n">subito</td><td>Iscriviti alla nuova cassa e aspetta la conferma scritta</td></tr>' +
      '<tr><td class="n">' + DATE.raccomandata + '</td><td>Spedisci la disdetta alla cassa di oggi, per raccomandata</td></tr>' +
      '<tr><td class="n">' + DATE.arrivo + '</td><td>La disdetta deve essere <b>arrivata</b> alla cassa di oggi</td></tr>' +
      '<tr><td class="n">' + DATE.inizio + '</td><td>Sei assicurata con la nuova cassa</td></tr>' +
      '</tbody></table></div>' +
      '<ol class="passi">' +
        '<li><b>Prima la nuova cassa.</b> Chiedi l’iscrizione alla nuova cassa: per l’assicurazione di base deve accettarti, senza domande sulla salute. Giorgio ti aiuta con il modulo.</li>' +
        '<li><b>Poi la disdetta.</b> Mandala alla cassa di oggi per raccomandata entro ' + DATE.raccomandata + '. Conta il giorno in cui arriva: deve essere lì entro ' + DATE.arrivo + '. Giorgio te la prepara.</li>' +
        '<li><b>Niente arretrati.</b> Se hai premi o fatture della cassa ancora da pagare, la disdetta non vale: saldali prima.</li>' +
        '<li><b>Complementari: non disdirle prima del tempo.</b> Toccale solo dopo l’accettazione scritta della nuova cassa: per le complementari la cassa può fare domande sulla salute e anche dire di no.</li>' +
      '</ol>';
    return h;
  }

  function notaComplementari(R) {
    // resta nella stessa cassa (altro prodotto, o la sua polizza senza infortunio): le complementari non si toccano
    var restaInCassa = R.verdetto.tipo === "cambia" && R.best && R.best.num === R.cassa;
    var c = S.compl, cambia = R.verdetto.tipo !== "bene" && !restaInCassa;
    if (!c.length) return cambia ? "Se hai complementari, possono restare nella cassa di oggi anche se cambi la base. Non disdirle prima di avere l’accettazione scritta della nuova cassa." : "";
    if (c.indexOf("nessuna") >= 0) return cambia ? "Non hai complementari: per cambiare ti basta spostare l’assicurazione di base." : "";
    if (c.indexOf("nonso") >= 0) return "Guarda la polizza: le complementari sono le righe oltre all’assicurazione di base (LAMal). Nel dubbio, non disdire niente oltre alla base e chiedi a Giorgio.";
    var nomi = { dentista: "dentista", ospedale: "ospedale", altro: "altre coperture" }, el = c.map(function (k) { return nomi[k]; }).filter(Boolean);
    var t = "Hai complementari (" + el.join(", ") + "). ";
    if (cambia) t += "Possono restare nella cassa di oggi anche se cambi la base: base e complementari non devono stare insieme. Non disdirle prima di avere l’accettazione scritta della nuova cassa. Giorgio controlla con te se alla tua complementare è legato uno sconto per chi ha anche la base.";
    else t += "Restano come sono. Se vuoi, Giorgio guarda con te se coprono ancora quello che ti serve.";
    return t;
  }

  function righeRisposte(R) {
    function riga(et, val, id) { return '<tr><td>' + et + '<br><span class="nota">' + val + '</span></td><td class="n"><a href="#" data-vai="' + id + '">modifica</a></td></tr>'; }
    var NS = { si: "Sì", no: "No", nonso: "Non lo so" };
    var mod = { libero: "Scelgo io il medico", medico: "Medico di famiglia", hmo: "Rete HMO", tel: "Telmed", altro: "Altro", nonso: "Non lo so" };
    var pref = { libero: "qualsiasi medico", medico: "medico di famiglia", hmo: "rete HMO", tel: "Telmed", farmacia: "farmacia" };
    var compl = { dentista: "dentista", ospedale: "ospedale", altro: "altro", nessuna: "nessuna", nonso: "non lo so" };
    var vis = {}; visibili().forEach(function (p) { vis[p.id] = true; });
    var h = riga("Anno di nascita", S.nascita ? esc(S.nascita) + (R.eta !== null ? " (" + R.eta + " anni nel 2027)" : "") : "—", "nascita") +
      riga("Domicilio", R.luogo ? esc(S.npa + " " + dove(R.luogo)) : esc(S.npa), "npa") +
      riga("Almeno 8 ore per lo stesso datore", NS[S.lavoro] || "senza risposta", "lavoro") +
      (S.lavoro === "si" ? riga("Infortunio nella polizza di oggi", NS[S.infOggi] || "senza risposta", "lavoro") : "") +
      riga("Cassa di oggi", isCassa(S.cassa) ? esc(nomeCassa(S.cassa)) : S.cassa === "nonso" ? "Non lo so" : "senza risposta", "cassa") +
      riga("Modello di oggi", mod[S.modello] || "senza risposta", "modello") +
      (vis.prodotto ? riga("Prodotto", S.prodotto === "nonso" ? "Non lo riconosco" : prodScelto() ? esc(nomeProd(S.cassa, prodScelto())) : "senza risposta", "prodotto") : "") +
      riga("Franchigia di oggi", typeof S.franchigia === "number" ? "CHF " + fmt(S.franchigia) : S.franchigia === "nonso" ? "Non lo so" : "senza risposta", "franchigia") +
      riga("Premio della lettera", S.lettera ? chf(Number(S.lettera), true) + " al mese" : "non scritto", "lettera") +
      riga("Ti va bene", S.pref.length ? S.pref.map(function (k) { return pref[k]; }).join(", ") : "come oggi", "pref") +
      riga("Spese sanitarie", LIVELLI[R.livStimato], "spese") +
      riga("Complementari", S.compl.length ? S.compl.map(function (k) { return compl[k]; }).join(", ") : "senza risposta", "compl");
    return h;
  }

  function datiDaInviare() {
    var R = R_ULTIMO || calcola(), v = R.verdetto;
    return {
      tipo: "svag-lamal-2027", versione: VERSIONE, creato: adesso(), nome: S.nome,
      risposte: {
        nascita: S.nascita || null, npa: S.npa || null, comune_ust: R.luogo && R.luogo.bfs ? R.luogo.bfs : null,
        lavoro_8_ore: S.lavoro, infortunio_oggi: S.infOggi,
        cassa: isCassa(S.cassa) ? Number(S.cassa) : S.cassa, modello: S.modello, prodotto: S.prodotto,
        franchigia: S.franchigia, premio_lettera: S.lettera ? Number(S.lettera) : null,
        // visite, farmaci e cure restano sul dispositivo: a Giorgio arriva solo il livello di spese (qui sotto)
        va_bene: S.pref, complementari: S.compl
      },
      risultato: {
        fascia: R.fa, regione: R.reg ? Number(R.reg) : null, comune: R.luogo ? R.luogo.c : null,
        cassa: R.cassa ? nomeCassa(R.cassa) : null, prodotto: R.cassa && R.prod ? nomeProd(R.cassa, R.prod) : null, codice_prodotto: R.prod,
        franchigia: R.F, infortunio: R.infOggi === "U", premio_mese: R.cur, fonte_premio: R.fonte,
        verdetto: v.tipo, motivo: v.motivo || null,
        risparmio_anno: v.tipo === "cambia" || v.tipo === "bene" ? Math.round(v.s) : null,
        franchigia_confronto: R.Fcmp, infortunio_alternative: R.infTarget === "U",
        alternative: R.alts.slice(0, 3).map(function (a) {
          return { cassa: a.nome, n_ufsp: Number(a.num), prodotto: nomeProd(a.num, a.code), premio_mese: a.v,
            risparmio_anno: R.cur !== null && R.F !== null ? Math.round((R.cur - a.v) * 12) : null };
        }),
        livello_spese: R.liv, spese_ipotesi: SPESE[R.liv],
        franchigia_consigliata: R.an && R.an.migliore ? R.an.migliore.f : null
      },
      dati: "UFSP premi 2027 Ticino, elaborati il " + D.generato
    };
  }
  function messaggio() {
    var d = datiDaInviare(), g = d.creato.slice(0, 10);
    var art = /^(08|11)\./.test(g) ? "l'" : "il ";
    return "Ciao Giorgio, ecco le mie risposte sulla cassa malati 2027" + (S.nome ? " (" + S.nome + ")" : "") + ", compilate " + art + g + ".\n" +
      "La pagina dice: " + verdettoFrase(R_ULTIMO || calcola()) + ".\n" +
      "Il testo qui sotto serve al tuo programma ed è giusto così: va mandato com'è.\n\n" + JSON.stringify(d);
  }

  function cRisultato() {
    app.querySelectorAll("[data-vai]").forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); mostra(a.getAttribute("data-vai"), true); });
    });
    if (!R_ULTIMO || !R_ULTIMO.reg || !R_ULTIMO.fa) return;
    disegnaGrafico();
    var gl = $("g-liv");
    if (gl) gl.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("button.pill") : null; if (!b) return;
      var k = b.getAttribute("data-v");
      S.livello = k === R_ULTIMO.livStimato ? null : k; salva();
      var y = window.scrollY;                 // un clic, non la digitazione: si ridisegna il risultato al suo posto
      app.innerHTML = '<div>' + pRisultato() + '</div>'; cRisultato();
      window.scrollTo(0, y);
      var nb = app.querySelector('#g-liv button[data-v="' + k + '"]'); if (nb) nb.focus({ preventScroll: true });
    });
    var nome = $("nome"), pre = $("json"), esito = $("esito");
    function aggJson() { pre.textContent = JSON.stringify(datiDaInviare(), null, 1); }
    aggJson();
    nome.addEventListener("input", function () { S.nome = nome.value.trim(); salva(); aggJson(); });
    $("whatsapp").addEventListener("click", function () {
      var url = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(messaggio());
      // senza «noopener» fra le opzioni: con quello window.open risponde sempre null e si aprirebbe due volte
      var w = window.open(url, "_blank");
      if (w) { try { w.opener = null; } catch (e) {} } else location.href = url;
      esito.textContent = "Se si è aperto WhatsApp, premi Invia: il testo con le parentesi è giusto così.";
    });
    $("email").addEventListener("click", function () {
      var sogg = "La mia cassa malati 2027" + (S.nome ? " - " + S.nome : "");
      location.href = "mailto:" + DESTINATARIO + "?subject=" + encodeURIComponent(sogg) + "&body=" + encodeURIComponent(messaggio() + "\n");
      esito.textContent = "Se si è aperta la posta, premi Invia. Le risposte restano anche qui.";
    });
    $("copia").addEventListener("click", function () {
      var t = messaggio();
      function ok() { esito.textContent = "Copiato. È normale che sia pieno di parentesi: incollalo così com’è in un messaggio a Giorgio."; }
      function ko() { esito.textContent = "Copia non riuscita: apri «Vedi i dati che invii» e copiali a mano."; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function () { copiaVecchia(t) ? ok() : ko(); });
      else if (copiaVecchia(t)) ok(); else ko();
    });
    $("cancella").addEventListener("click", function () {
      if (!confirm("Cancellare le tue risposte da questo dispositivo? Quelle già mandate a Giorgio restano a lui.")) return;
      try { localStorage.removeItem(CHIAVE); } catch (e) {}
      S = applicaPre(statoVuoto()); ripreso = false;
      mostra("benvenuto");
    });
  }
  function copiaVecchia(t) {
    var ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); return ok;
  }

  function avvia() {
    CASSE = Object.keys(D.assicuratori).map(function (k) { var a = D.assicuratori[k]; return { num: k, nome: a.nome, gruppo: a.gruppo }; })
      .sort(function (a, b) { return chiaveOrd(a.nome).localeCompare(chiaveOrd(b.nome)); });
    leggiPre(); leggiStato();
    $("indietro").addEventListener("click", indietro);
    $("avanti").addEventListener("click", avanti);
    mostra(S.passo);
  }
})();
</script>
